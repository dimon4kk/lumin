<!DOCTYPE html>
<html lang="uk">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>LumiGlow — Твій стильний світильник</title>
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;600&display=swap" rel="stylesheet">
  <style>
    body {
      margin: 0;
      font-family: 'Montserrat', sans-serif;
      background: #f9f9f9;
      color: #333;
      line-height: 1.6;
    }
    header {
      background: #000;
      color: #fff;
      text-align: center;
      padding: 80px 20px;
    }
    header h1 {
      font-size: 56px;
      margin: 0 0 10px;
    }
    header p {
      font-size: 24px;
      margin-bottom: 30px;
    }
    .btn {
      background: #f5b301;
      color: #000;
      padding: 14px 36px;
      border: none;
      border-radius: 8px;
      font-size: 20px;
      cursor: pointer;
      transition: 0.3s;
    }
    .btn:hover {
      background: #d49e00;
    }
    .section {
      padding: 80px 20px;
      max-width: 1000px;
      margin: auto;
      text-align: center;
    }
    .section h2 {
      font-size: 36px;
      margin-bottom: 20px;
    }
    .gallery {
      display: flex;
      gap: 30px;
      flex-wrap: wrap;
      justify-content: center;
    }
    .gallery img {
      width: 320px;
      border-radius: 12px;
      box-shadow: 0 10px 20px rgba(0, 0, 0, 0.1);
      transition: transform 0.3s ease;
    }
    .gallery img:hover {
      transform: scale(1.05);
    }
    .price {
      font-size: 32px;
      font-weight: bold;
      margin: 20px 0;
    }
    form {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 20px;
      margin-top: 40px;
    }
    input {
      padding: 14px;
      width: 100%;
      max-width: 450px;
      border: 1px solid #ccc;
      border-radius: 8px;
      font-size: 18px;
    }
    footer {
      background: #eee;
      padding: 30px;
      text-align: center;
      font-size: 16px;
      color: #777;
    }
    footer a {
      text-decoration: none;
      color: #333;
      font-weight: bold;
    }
  </style>
</head>
<body>

<header>
  <h1>LumiGlow</h1>
  <p>Дизайнерський світильник, що змінює атмосферу твого дому</p>
  <button class="btn" onclick="window.location.href='https://t.me/Dimon4kk'">Замовити</button>
</header>

<section class="section">
  <h2>Чому обирають LumiGlow?</h2>
  <p>Сучасний дизайн, тепле світло, натуральні матеріали. Ідеально пасує до будь-якого інтер'єру.</p>
</section>

<section class="section gallery">
  <img src="img1.jpg" alt="">
  <img src="img2.jpg" alt="">
  <img src="img3.jpg" alt="">
  <img src="img4.jpg" alt="">
</section>

<section class="section" id="order">
  <h2>Ціна</h2>
  <div class="price">599 грн</div>
</section>

<footer>
  &copy; 2025 LumiGlow. Всі права захищені.
</footer>

<script>
  function scrollToOrder() {
    document.getElementById('order').scrollIntoView({ behavior: 'smooth' });
  }
</script>

</body>
</html>
